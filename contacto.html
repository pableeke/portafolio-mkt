<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contacto - pablekee</title>

    <!-- FAVICON / LOGO DE PESTAÑA -->
    <link rel="icon" type="image/png" href="img/avatar.png">

    <link rel="stylesheet" href="css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <main class="card card-wide">

        <!-- MENÚ DE NAVEGACIÓN -->
        <header>
            <nav class="nav">

                <ul class="nav-list">

                    <li>
                        <a href="index.html" class="nav-link">
                            Inicio
                        </a>
                    </li>

                    <li>
                        <a href="proyectos.html" class="nav-link">
                            Proyectos
                        </a>
                    </li>

                    <li>
                        <a href="contacto.html" class="nav-link active">
                            Contacto
                        </a>
                    </li>

                </ul>

            </nav>
        </header>

        <!-- SECCIÓN DE CONTACTO EN GRID -->
        <div class="contact-grid">

            <!-- COLUMNA IZQUIERDA: FORMULARIO -->
            <div class="contact-left">

                <section class="section-header">
                    <h1 class="section-title">Contacto</h1>
                    <p class="section-subtitle">
                        ¿Tienes un proyecto en mente?<br>
                        ¡Hablemos! Completa el formulario<br>
                        y me pondré en contacto contigo.
                    </p>
                </section>

                <form class="contact-form" action="#" method="POST">

                    <div class="form-group">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre" class="form-input" placeholder="Tu nombre"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="email">Correo electrónico</label>
                        <input type="email" id="email" name="email" class="form-input" placeholder="tu@email.com"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="mensaje">Mensaje</label>
                        <textarea id="mensaje" name="mensaje" class="form-input form-textarea"
                            placeholder="Cuéntame sobre tu proyecto..." required></textarea>
                    </div>

                    <button type="submit" class="btn-submit">
                        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                        <span>Enviar mensaje</span>
                    </button>

                </form>

            </div>

            <!-- COLUMNA DERECHA: CONTACTO DIRECTO -->
            <div class="contact-right">

                <div class="direct-contact-card">
                    <div class="direct-contact-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z">
                            </path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                    </div>
                    <div class="direct-contact-info">
                        <span class="direct-contact-label">También puedes escribirme a</span>
                        <a href="mailto:hola@pablekee.com" class="direct-contact-email">hola@pablekee.com</a>
                        <span class="direct-contact-note">Responderé a la brevedad posible.</span>
                    </div>
                </div>

            </div>

        </div>

    </main>

</body>

</html>
